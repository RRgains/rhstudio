
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praia do Coelha Restaurant Menu</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #f8fdfa;
            transition: background-color 0.3s ease;
        }
        h1, h2, h3 {
            font-family: 'Playfair Display', serif;
        }
        .menu-link {
            color: #004a69;
            font-weight: bold;
        }
        .menu-link:hover {
            color: #3997c7;
        }
        .menu-card {
            background: #ffffffcc;
            border-radius: 18px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.10);
            backdrop-filter: blur(2px);
        }
        .bg-default {
            background: linear-gradient(135deg, #80bbad 0%, #f8fdfa 100%);
        }
        .bg-drinks {
            background: linear-gradient(135deg, #3997c7 0%, #a8e6cf 100%);
        }
        .bg-wine {
            background: linear-gradient(135deg, #06a8c5 0%, #f7e7ce 100%);
        }
        .menu-section-title {
            font-family: 'Playfair Display', serif;
            letter-spacing: 0.02em;
            text-shadow: 0 2px 8px #004a6922;
        }
        .menu-btn-active {
            background: #004a69 !important;
            color: #fff !important;
            border: none !important;
        }
        .menu-btn-inactive {
            background: #fff !important;
            color: #004a69 !important;
            border: 1.5px solid #004a69 !important;
        }
        .menu-grow {
            transform: scale(1.15);
            transition: transform 0.2s cubic-bezier(.4,2,.6,1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-default" id="pageBody">
    <!-- Navigation -->
    <nav class="w-full bg-transparent text-white shadow-md sticky top-0 z-50 transition-all duration-300">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html">
                <img src="img/logo2.png" alt="Praia do Coelha Logo" class="h-10 w-auto">
            </a>
            <div class="space-x-8 hidden md:flex">
                <a href="index.html" class="hover:text-[#a8e6cf] transition">Home</a>
                <a href="index.html#about" class="hover:text-[#a8e6cf] transition">About</a>
                <a href="index.html#gallery" class="hover:text-[#a8e6cf] transition">Gallery</a>
                <a href="index.html#beach" class="hover:text-[#a8e6cf] transition">The Beach</a>
                <a href="index.html#contact" class="hover:text-[#a8e6cf] transition">Contact</a>
                <a href="menu.html" id="menu-link" class="text-[#3997c7] font-bold underline">Menu</a>
            </div>
            <!-- Sandwich menu button for mobile -->
            <button id="mobile-menu-button" class="md:hidden focus:outline-none">
                <svg id="menu-icon" xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-[#004a69]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
        </div>
        <!-- Mobile menu (hidden by default) -->
        <div id="mobile-menu" class="md:hidden fixed top-0 left-0 w-full h-full bg-white bg-opacity-95 z-50 flex flex-col items-center justify-center gap-8 text-[#004a69] text-2xl font-semibold transition-all duration-300 opacity-0 pointer-events-none">
            <a href="index.html" class="block py-2 transition mobile-menu-link">Home</a>
            <a href="index.html#about" class="block py-2 transition mobile-menu-link">About</a>
            <a href="index.html#gallery" class="block py-2 transition mobile-menu-link">Gallery</a>
            <a href="index.html#beach" class="block py-2 transition mobile-menu-link">The Beach</a>
            <a href="index.html#contact" class="block py-2 transition mobile-menu-link">Contact</a>
            <a href="menu.html" class="block py-2 transition font-bold mobile-menu-link underline">Menu</a>
            <button id="close-mobile-menu" class="absolute top-6 right-8 text-3xl text-[#004a69]">&times;</button>
        </div>
    </nav>

    <!-- Decorative SVG blobs -->
    <svg class="absolute left-0 top-0 w-64 h-64 opacity-20 -z-10 pointer-events-none" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <path fill="#4ba291" d="M44.8,-67.7C57.7,-59.6,67.9,-48.2,74.2,-34.9C80.5,-21.6,82.9,-6.5,80.2,7.7C77.6,21.9,69.9,35.2,59.1,46.2C48.3,57.2,34.4,65.9,19.2,70.2C4,74.5,-12.5,74.4,-28.2,69.2C-43.9,64,-58.7,53.7,-66.9,39.9C-75.1,26.1,-76.7,8.7,-74.2,-7.6C-71.7,-23.9,-65.1,-39.1,-54.8,-48.7C-44.5,-58.3,-30.5,-62.3,-16.1,-67.2C-1.7,-72.1,13.1,-77.8,27.7,-76.2C42.3,-74.6,57.7,-65.8,44.8,-67.7Z" transform="translate(100 100)" />
    </svg>
    <svg class="absolute right-0 bottom-0 w-64 h-64 opacity-10 -z-10 pointer-events-none" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <path fill="#3b95c4" d="M44.8,-67.7C57.7,-59.6,67.9,-48.2,74.2,-34.9C80.5,-21.6,82.9,-6.5,80.2,7.7C77.6,21.9,69.9,35.2,59.1,46.2C48.3,57.2,34.4,65.9,19.2,70.2C4,74.5,-12.5,74.4,-28.2,69.2C-43.9,64,-58.7,53.7,-66.9,39.9C-75.1,26.1,-76.7,8.7,-74.2,-7.6C-71.7,-23.9,-65.1,-39.1,-54.8,-48.7C-44.5,-58.3,-30.5,-62.3,-16.1,-67.2C-1.7,-72.1,13.1,-77.8,27.7,-76.2C42.3,-74.6,57.7,-65.8,44.8,-67.7Z" transform="translate(100 100)" />
    </svg>

    <main class="flex-1 flex flex-col items-center justify-center py-16 px-4 relative z-10">
        <!-- Menu Title -->
        <h1 class="text-5xl md:text-6xl font-bold text-center mb-10 text-[#004a69] menu-section-title drop-shadow-lg" data-aos="fade-down">
            Our Menu
        </h1>
        <!-- Menu Toggle Buttons -->
        <div class="flex gap-4 mb-10" data-aos="fade-up">
            <button id="foodBtn" class="px-6 py-2 rounded-full font-semibold menu-btn-active shadow transition">Food</button>
            <button id="drinksBtn" class="px-6 py-2 rounded-full font-semibold menu-btn-inactive shadow transition">Drinks</button>
            <button id="wineBtn" class="px-6 py-2 rounded-full font-semibold menu-btn-inactive shadow transition">Wine</button>
        </div>
        <!-- Menu Card -->
        <div class="menu-card w-full max-w-3xl mx-auto p-8 flex flex-col gap-8 items-center" data-aos="zoom-in">
            <!-- Food Menu Container -->
            <div id="foodMenu" class="w-full flex flex-col gap-8 items-center">
                <!-- Language Toggle Buttons -->
                <div class="flex gap-2 mb-4">
                    <button id="englishBtn" class="px-4 py-2 rounded-full bg-white text-[#004a69] border border-[#004a69] flex items-center gap-1 hover:bg-[#3997c7] hover:text-white transition">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="9" y1="3" x2="9" y2="18"></line>
                            <line x1="15" y1="3" x2="15" y2="18"></line>
                            <line x1="3" y1="9" x2="18" y2="9"></line>
                            <line x1="3" y1="15" x2="18" y2="15"></line>
                        </svg>
                        EN
                    </button>
                    <button id="portugueseBtn" class="px-4 py-2 rounded-full bg-[#004a69] text-white flex items-center gap-1 hover:bg-[#3997c7] transition">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2" fill="#0051b2"></rect>
                            <rect x="9" y="3" width="6" height="18" fill="#fff"></rect>
                            <rect x="15" y="3" width="6" height="18" fill="#0051b2"></rect>
                        </svg>
                        PT
                    </button>
                </div>
                <!-- English Menu Images (shown by default) -->
                <div id="englishMenu" class="w-full flex flex-col gap-8 items-center">
                    <div class="w-full aspect-[3/4] flex items-center justify-center">
                        <img 
                            src="img/menu_comidas_gb.jpg"
                            alt="English Menu"
                            class="rounded-lg shadow-lg mx-auto w-full h-full object-contain border border-[#4ba291] menu-image"
                            style="min-height: 0; border: none;"
                        />
                    </div>
                    <div class="w-full aspect-[3/4] flex items-center justify-center">
                        <img 
                            src="img/menu_comidas_gb2.jpg"
                            alt="English Menu"
                            class="rounded-lg shadow-lg mx-auto w-full h-full object-contain border border-[#4ba291] menu-image"
                            style="min-height: 0; border: none;"
                        />
                    </div>
                </div>
                <!-- Portuguese Menu Images (hidden by default) -->
                <div id="portugueseMenu" class="w-full flex flex-col gap-8 items-center hidden">
                    <div class="w-full aspect-[3/4] flex items-center justify-center">
                        <img 
                            src="img/menu_comidas_pt.jpg"
                            alt="Portuguese Menu"
                            class="rounded-lg shadow-lg mx-auto w-full h-full object-contain border border-[#4ba291] menu-image"
                            style="min-height: 0; border: none;"
                        />
                    </div>
                    <div class="w-full aspect-[3/4] flex items-center justify-center">
                        <img 
                            src="img/menu_comidas_pt2.jpg"
                            alt="Portuguese Menu"
                            class="rounded-lg shadow-lg mx-auto w-full h-full object-contain border border-[#4ba291] menu-image"
                            style="min-height: 0; border: none;"
                        />
                    </div>
                </div>
            </div>
            <!-- Drinks Menu Images (hidden by default) -->
            <div id="drinksMenu" class="w-full flex flex-col gap-8 items-center hidden">
                <div class="w-full aspect-[3/4] flex items-center justify-center">
                    <img 
                        src="img/menu_bebidas.jpg"
                        alt="Drinks Menu"
                        class="rounded-lg shadow-lg mx-auto w-full h-full object-contain border border-[#4ba291] menu-image"
                        style="min-height: 0; border: none;"
                    />
                </div>
                <div class="w-full aspect-[3/4] flex items-center justify-center">
                    <img 
                        src="img/menu_bebidas2.jpg"
                        alt="Menu"
                        class="rounded-lg shadow-lg mx-auto w-full h-full object-contain border border-[#4ba291] menu-image"
                        style="min-height: 0; border: none;"
                    />
                </div>
            </div>
            <!-- Wine Menu Images (hidden by default) -->
            <div id="wineMenu" class="w-full flex flex-col gap-8 items-center hidden">
                <div class="w-full aspect-[3/4] flex items-center justify-center">
                    <img 
                        src="img/vinhos.jpg"
                        alt="Wine Menu"
                        class="rounded-lg shadow-lg mx-auto w-full h-full object-contain border border-[#4ba291] menu-image"
                        style="min-height: 0; border: none;"
                    />
                </div>
                <div class="w-full aspect-[3/4] flex items-center justify-center">
                    <img 
                        src="img/vinhos2.jpg"
                        alt="Wine Menu"
                        class="rounded-lg shadow-lg mx-auto w-full h-full object-contain border border-[#4ba291] menu-image"
                        style="min-height: 0; border: none;"
                    />
                </div>
            </div>
        </div>
    </main>
    <!-- Footer -->
    <footer class="py-12 text-white" style="background: linear-gradient(135deg, #004a69 0%, #3b95c4 100%);">
        <div class="container mx-auto px-6">
            <div class="flex flex-col md:flex-row justify-between items-center">
                <div class="mb-6 md:mb-0">
                    <h3 class="text-2xl font-bold">Praia do Coelha</h3>
                    <p class="mt-2 text-gray-200">Where the ocean meets exquisite cuisine</p>
                </div>
                <div class="flex space-x-6">
                    <a href="#" class="text-gray-200 hover:text-white transition"><i data-feather="facebook"></i></a>
                    <a href="#" class="text-gray-200 hover:text-white transition"><i data-feather="instagram"></i></a>
                    <!-- Tripadvisor SVG Icon -->
                    <a href="https://www.tripadvisor.com/" target="_blank" rel="noopener" aria-label="Tripadvisor" class="hover:text-[#34e0a1] transition flex items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" viewBox="0 0 32 32">
                            <circle cx="16" cy="16" r="16" fill="#fff"/>
                            <g>
                                <circle cx="11" cy="16" r="4" fill="#fff" stroke="#34e0a1" stroke-width="2"/>
                                <circle cx="21" cy="16" r="4" fill="#fff" stroke="#34e0a1" stroke-width="2"/>
                                <circle cx="11" cy="16" r="1.5" fill="#34e0a1"/>
                                <circle cx="21" cy="16" r="1.5" fill="#34e0a1"/>
                                <path d="M6 16c2.5-3 7.5-3 10 0 2.5-3 7.5-3 10 0" stroke="#004a69" stroke-width="1.5" fill="none"/>
                            </g>
                        </svg>
                    </a>
                </div>
            </div>
            <div class="border-t border-[#3d1a10] mt-8 pt-8 text-center text-white">
            <p>&copy; <span id="current-year">2025</span> Praia da Coelha. Created as a part of 
                <a href="https://www.innovatesphere.pt/" target="_blank" class="color-black hover:text-gold-400 transition duration-300 font-medium">INNOVATE SPHERE</a>.
            </p>
        </div>
    </div>
</footer>

<!-- Image Modal -->
<div id="imageModal" class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50 hidden">
    <span id="closeModal" class="absolute top-6 right-8 text-4xl text-white cursor-pointer select-none">&times;</span>
    <img id="modalImg" src="" alt="Menu Image" class="max-h-[90vh] max-w-[95vw] rounded-lg shadow-2xl border-4 border-white object-contain" />
</div>

<script>
        AOS.init();

        const foodBtn = document.getElementById('foodBtn');
        const drinksBtn = document.getElementById('drinksBtn');
        const wineBtn = document.getElementById('wineBtn');
        const foodMenu = document.getElementById('foodMenu');
        const drinksMenu = document.getElementById('drinksMenu');
        const wineMenu = document.getElementById('wineMenu');
        const pageBody = document.getElementById('pageBody');
        const englishBtn = document.getElementById('englishBtn');
        const portugueseBtn = document.getElementById('portugueseBtn');
        const englishMenu = document.getElementById('englishMenu');
        const portugueseMenu = document.getElementById('portugueseMenu');

        // Helper to set active/inactive menu buttons
        function setMenuBtnActive(activeBtn, ...inactiveBtns) {
            activeBtn.classList.add('menu-btn-active');
            activeBtn.classList.remove('menu-btn-inactive');
            inactiveBtns.forEach(btn => {
                btn.classList.remove('menu-btn-active');
                btn.classList.add('menu-btn-inactive');
            });
        }

        // Initial state
        setMenuBtnActive(foodBtn, drinksBtn, wineBtn);
        englishBtn.classList.add('bg-white', 'text-[#004a69]', 'border', 'border-[#004a69]');
        portugueseBtn.classList.add('bg-[#004a69]', 'text-white');
        englishMenu.classList.remove('hidden');
        portugueseMenu.classList.add('hidden');

        // Food/Drinks/Wine toggle functionality
        foodBtn.addEventListener('click', () => {
            foodMenu.classList.remove('hidden');
            drinksMenu.classList.add('hidden');
            wineMenu.classList.add('hidden');
            setMenuBtnActive(foodBtn, drinksBtn, wineBtn);
            pageBody.classList.remove('bg-drinks', 'bg-wine');
            pageBody.classList.add('bg-default');
            englishBtn.classList.add('bg-white', 'text-[#004a69]', 'border', 'border-[#004a69]');
            portugueseBtn.classList.remove('bg-[#004a69]', 'text-white');
            portugueseBtn.classList.add('bg-white', 'text-[#004a69]', 'border', 'border-[#004a69]');
            englishMenu.classList.remove('hidden');
            portugueseMenu.classList.add('hidden');
        });
        drinksBtn.addEventListener('click', () => {
            drinksMenu.classList.remove('hidden');
            foodMenu.classList.add('hidden');
            wineMenu.classList.add('hidden');
            setMenuBtnActive(drinksBtn, foodBtn, wineBtn);
            pageBody.classList.remove('bg-default', 'bg-wine');
            pageBody.classList.add('bg-drinks');
        });
        wineBtn.addEventListener('click', () => {
            wineMenu.classList.remove('hidden');
            foodMenu.classList.add('hidden');
            drinksMenu.classList.add('hidden');
            setMenuBtnActive(wineBtn, foodBtn, drinksBtn);
            pageBody.classList.remove('bg-default', 'bg-drinks');
            pageBody.classList.add('bg-wine');
        });

        // Language toggle functionality
        englishBtn.addEventListener('click', () => {
            englishBtn.className = 'px-4 py-2 rounded-full bg-white text-[#004a69] border border-[#004a69] flex items-center gap-1 hover:bg-[#3997c7] hover:text-white transition';
            portugueseBtn.className = 'px-4 py-2 rounded-full bg-white text-[#004a69] border border-[#004a69] flex items-center gap-1 hover:bg-[#3997c7] hover:text-white transition';
            englishMenu.classList.remove('hidden');
            portugueseMenu.classList.add('hidden');
        });
        portugueseBtn.addEventListener('click', () => {
            portugueseBtn.className = 'px-4 py-2 rounded-full bg-[#004a69] text-white flex items-center gap-1 hover:bg-[#3997c7] transition';
            englishBtn.className = 'px-4 py-2 rounded-full bg-white text-[#004a69] border border-[#004a69] flex items-center gap-1 hover:bg-[#3997c7] hover:text-white transition';
            portugueseMenu.classList.remove('hidden');
            englishMenu.classList.add('hidden');
        });

        // Mobile sandwich menu functionality
        const mobileMenuButton = document.getElementById('mobile-menu-button');
        const mobileMenu = document.getElementById('mobile-menu');
        const closeMobileMenu = document.getElementById('close-mobile-menu');

        mobileMenuButton.addEventListener('click', () => {
            mobileMenu.classList.remove('opacity-0', 'pointer-events-none');
            mobileMenu.classList.add('opacity-100');
        });

        closeMobileMenu.addEventListener('click', () => {
            mobileMenu.classList.add('opacity-0', 'pointer-events-none');
            mobileMenu.classList.remove('opacity-100');
        });

        // Optional: Close menu when clicking a link
        document.querySelectorAll('.mobile-menu-link').forEach(link => {
            link.addEventListener('click', () => {
                mobileMenu.classList.add('opacity-0', 'pointer-events-none');
                mobileMenu.classList.remove('opacity-100');
            });
        });

        // Modal logic for enlarging images
        const imageModal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImg');
        const closeModal = document.getElementById('closeModal');

        // Add click event to all menu images
        document.querySelectorAll('.menu-card img').forEach(img => {
            img.style.cursor = 'zoom-in';
            img.addEventListener('click', () => {
                modalImg.src = img.src;
                imageModal.classList.remove('hidden');
                document.body.style.overflow = 'hidden'; // Prevent background scroll
            });
        });

        // Close modal on click
        closeModal.addEventListener('click', () => {
            imageModal.classList.add('hidden');
            modalImg.src = '';
            document.body.style.overflow = '';
        });

        // Optional: Close modal when clicking outside the image
        imageModal.addEventListener('click', (e) => {
            if (e.target === imageModal) {
                imageModal.classList.add('hidden');
                modalImg.src = '';
                document.body.style.overflow = '';
            }
        });
    </script>
</body>
</html>
